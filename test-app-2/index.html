<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Task Tracker</h1>
      <p class="subtitle">Keep track of what matters</p>
    </header>

    <section class="add-task">
      <form id="task-form" novalidate>
        <div class="input-group">
          <input
            type="text"
            id="task-input"
            placeholder="What do you need to do?"
            maxlength="200"
            autocomplete="off"
            aria-label="New task description"
          >
          <button type="submit" id="add-btn">Add</button>
        <span id="char-count" class="char-count" aria-live="polite">200</span>
        </div>
        <p id="validation-msg" class="validation-msg" aria-live="polite"></p>
      </form>
    </section>

    <section class="stats">
      <div class="stats__header">
        <p id="task-count" class="task-count" aria-live="polite" role="status">0 of 0 tasks completed</p>
      </div>
      <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <section class="task-list">
      <ul id="task-list" class="task-list__items"></ul>
    </section>

    <section class="empty-state" id="empty-state">
      <div class="empty-state__content">
        <span class="empty-state__icon" aria-hidden="true">📋</span>
        <p class="empty-state__title">No tasks yet</p>
        <p class="empty-state__text">Add your first task above to get started!</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
